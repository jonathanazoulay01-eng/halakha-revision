<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hazara Halakha</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: une seule carte d'étude centrée, avec une échelle de 6 niveaux au-dessus ; panneau latéral (tiroir sur mobile) pour la table des seifim. */
:root{
  --bg:#f3f4f1; --surface:#fbfbf9; --ink:#1d2523; --muted:#5f6b67; --line:#d9ddd6;
  --accent:#1f5b55; --accent-soft:#e1ece9; --brass:#9a6b1f; --brass-soft:#f3ead8;
  --mk:#d84315; --ri:#1565c0; --ah:#c2185b; --mk-soft:#fbe9e7; --ri-soft:#e3f0fd; --ah-soft:#fce4ec;
  --good:#2e7d4f; --good-soft:#e2f1e7; --warn:#b4542b; --warn-soft:#f7e5dc;
  --he:"Frank Ruhl Libre","David Libre","Times New Roman",serif;
  --rashi:"Noto Rashi Hebrew","Frank Ruhl Libre",serif;
  --ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a19; --surface:#1b2321; --ink:#e6ebe8; --muted:#9aa8a3; --line:#2e3a37;
  --accent:#6fb7ad; --accent-soft:#1f3532; --brass:#d6a75a; --brass-soft:#352c1c;
  --mk:#ff8a65; --ri:#64b5f6; --ah:#f48fb1; --mk-soft:#3a2219; --ri-soft:#172a3d; --ah-soft:#3a1c27;
  --good:#6cc492; --good-soft:#1c3226; --warn:#e48a62; --warn-soft:#3a251c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a19; --surface:#1b2321; --ink:#e6ebe8; --muted:#9aa8a3; --line:#2e3a37;
  --accent:#6fb7ad; --accent-soft:#1f3532; --brass:#d6a75a; --brass-soft:#352c1c;
  --mk:#ff8a65; --ri:#64b5f6; --ah:#f48fb1; --mk-soft:#3a2219; --ri-soft:#172a3d; --ah-soft:#3a1c27;
  --good:#6cc492; --good-soft:#1c3226; --warn:#e48a62; --warn-soft:#3a251c; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.5;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}

header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;margin-bottom:18px}
.brand{display:flex;align-items:baseline;gap:10px;margin-inline-end:auto}
.brand h1{font-family:var(--he);font-weight:700;font-size:26px;margin:0;letter-spacing:.01em}
.brand span{color:var(--muted);font-size:13px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,.seg button,.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:14px;color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent}
.seg button+button{border-inline-start:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:24px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr)}}

/* Table des seifim */
aside.toc{order:2;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 40px);overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:14px}
.toc h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}
.stat{border-radius:8px;padding:6px 8px;background:var(--bg);font-variant-numeric:tabular-nums}
.stat b{display:block;font-size:18px}
.stat small{color:var(--muted);font-size:11px}
.stat.g b{color:var(--good)} .stat.r b{color:var(--warn)}
.toc ol{list-style:none;margin:0;padding:0;direction:rtl}
.toc li.seif>div{font-family:var(--he);font-weight:700;font-size:15px;margin:10px 0 2px;color:var(--accent)}
.toc button.t{display:flex;width:100%;align-items:center;gap:8px;border:0;background:transparent;padding:4px 6px;border-radius:6px;text-align:right;font-family:var(--he);font-size:15px}
.toc button.t:hover{background:var(--bg)}
.toc button.t[aria-current="true"]{background:var(--accent-soft)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--line)}
.dot.known{background:var(--good)} .dot.review{background:var(--warn)}
@media (max-width:860px){aside.toc{order:0;position:static;max-height:none}aside.toc[data-collapsed="true"] .toc-body{display:none}}
.toc-toggle{display:none}
@media (max-width:860px){.toc-toggle{display:inline-block;margin-bottom:8px}}

/* Carte */
main.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px clamp(16px,3vw,32px) 26px;min-width:0}
.crumbs{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center;color:var(--muted);font-size:13px;margin-bottom:14px}
.crumbs .he{font-family:var(--he);font-size:16px;color:var(--ink);direction:rtl}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500}
.pill.known{background:var(--good-soft);color:var(--good)} .pill.review{background:var(--warn-soft);color:var(--warn)} .pill.new{background:var(--bg);color:var(--muted)}

.ladder{display:flex;gap:4px;margin:0 0 20px;direction:rtl}
.rung{flex:1 1 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-top:3px solid var(--line);padding-top:6px;font-size:12px;color:var(--muted);text-align:center;font-family:var(--he)}
.rung.on{border-color:var(--accent);color:var(--ink)}
.rung.skip{opacity:.4;border-top-style:dashed}
.rung.cur{border-color:var(--brass);color:var(--brass);font-weight:700}

.question{direction:rtl;font-family:var(--he);font-size:clamp(22px,2.6vw,28px);line-height:1.45;font-weight:500;margin:0 0 6px;text-wrap:balance}
.qtitle{direction:rtl;color:var(--muted);font-family:var(--he);font-size:15px;margin-bottom:18px}

.levels{display:flex;flex-direction:column;gap:14px;direction:rtl}
.lvl{border-top:1px solid var(--line);padding-top:14px;animation:in .25s ease-out}
@keyframes in{from{transform:translateY(4px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.lvl{animation:none}}
.lvl h3{font-family:var(--ui);direction:ltr;text-align:right;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--brass);margin:0 0 8px;font-weight:600}
.lvl h3 .heb{font-family:var(--he);letter-spacing:0;text-transform:none;font-size:14px;margin-inline-start:6px}
.ref{font-family:var(--he);font-size:22px;font-weight:700;color:var(--mk)}
.he-text{font-family:var(--he);font-size:18px;line-height:1.75;max-width:68ch}
.he-text p{margin:0 0 .55em}
.gm{background:var(--brass-soft);border-radius:10px;padding:12px 16px}
.op{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;padding:8px 0;border-bottom:1px dashed var(--line)}
.op:last-child{border-bottom:0}
.op .who{font-family:var(--he);font-weight:700;color:var(--ri);font-size:18px}
.op.ah .who{color:var(--ah)}
.op .txt{font-family:var(--he);font-size:17.5px;line-height:1.7}
.psak-block{margin-bottom:10px}
.psak-block .lab{font-family:var(--he);font-weight:700;font-size:15px;color:var(--ink);background:var(--accent-soft);display:inline-block;padding:1px 10px;border-radius:6px;margin-bottom:4px}
.psak-block ul{margin:4px 0 0;padding-inline-start:20px}
.psak-block li{font-family:var(--he);font-size:17.5px;line-height:1.7;margin-bottom:3px}
.sa{font-family:var(--he);font-size:18.5px;line-height:1.75;border-inline-start:3px solid var(--accent);padding-inline-start:12px}
.notes{font-family:var(--he);font-size:16.5px;color:var(--muted);font-style:italic}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;font-family:var(--he);font-size:15.5px;min-width:520px;width:100%}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 9px;text-align:right;vertical-align:top}
.tbl th{background:var(--bg)}

.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;align-items:center}
.btn.primary{background:var(--accent);color:var(--surface);border-color:var(--accent);font-weight:500}
.btn.good{background:var(--good-soft);color:var(--good);border-color:transparent;font-weight:600}
.btn.bad{background:var(--warn-soft);color:var(--warn);border-color:transparent;font-weight:600}
.btn.ghost{background:transparent}
.spacer{flex:1}
.kbd{color:var(--muted);font-size:12px}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
.ctl-seif{margin-bottom:22px;direction:rtl}
.ctl-seif>h2{font-family:var(--he);font-size:21px;margin:0 0 10px;color:var(--ink);border-bottom:2px solid var(--line);padding-bottom:4px}
.ctl-t{padding:10px 0 12px;border-bottom:1px dashed var(--line)}
.ctl-t:last-child{border-bottom:0}
.ctl-t h3{font-family:var(--he);font-size:18px;margin:0 0 6px;font-weight:700}
.ctl-row{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;margin:5px 0}
.ctl-lab{font-family:var(--he);font-size:14px;color:var(--muted);min-width:64px}
.chip{font-family:var(--he);font-size:16.5px;font-weight:700;border:0;border-radius:7px;padding:3px 10px;text-align:right;line-height:1.4}
.chip.mk{background:var(--mk-soft);color:var(--mk)}
.ctl-op.gm{background:var(--brass-soft)}
.chip.ps{background:var(--good-soft);color:var(--good)}
.ctl-op.psk{border-inline-start-color:var(--good)}
.ctl-op.psk b{color:var(--good)}
.chip.ri{background:var(--ri-soft);color:var(--ri)}
.chip.ah{background:var(--ah-soft);color:var(--ah)}
.chip[aria-expanded="true"]{outline:2px solid currentColor}
.ctl-op{font-family:var(--he);font-size:17px;line-height:1.7;margin:4px 0 6px;padding:6px 12px;border-inline-start:3px solid var(--line);background:var(--bg);border-radius:6px}
.ctl-help{color:var(--muted);font-size:13px;margin:0 0 16px}
.ask-form{display:flex;flex-direction:column;gap:10px}
.ask-form textarea{font:inherit;font-size:17px;min-height:96px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);color:var(--ink);resize:vertical;width:100%}
.ask-form textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ask-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ask-ans{margin-top:18px;border-top:1px solid var(--line);padding-top:14px;white-space:pre-wrap;font-size:16px;line-height:1.7;unicode-bidi:plaintext}
.ask-ans:empty{display:none}
.ask-ans.he,.ask-ans [dir=rtl]{font-family:var(--he);font-size:17.5px}
.ask-status{color:var(--muted);font-size:13px}
.ask-src{margin-top:18px;direction:rtl}
.ask-src h3{font-family:var(--ui);direction:ltr;text-align:right;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--brass);margin:0 0 8px;font-weight:600}
.ask-src button{display:block;width:100%;text-align:right;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 12px;margin-bottom:6px;font-family:var(--he);font-size:16px}
.ask-src button small{display:block;color:var(--muted);font-size:13.5px}
.ask-src button:hover{border-color:var(--accent)}
footer.f{margin-top:20px;color:var(--muted);font-size:12.5px;text-align:center}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><h1>חזרה בהלכה</h1><span id="brandSub">Révision par seif</span></div>
    <div class="controls">
      <select id="simanSel" aria-label="Siman"></select>
      <div class="seg" role="group" aria-label="Version">
        <button id="v-rev" aria-pressed="true">Révision</button>
        <button id="v-ctl" aria-pressed="false">Contrôle</button>
        <button id="v-ask" aria-pressed="false">Question</button>
      </div>
      <div class="seg" role="group" aria-label="Mode" id="modeSeg">
        <button id="m-order" aria-pressed="true">Dans l'ordre</button>
        <button id="m-random" aria-pressed="false">Aléatoire</button>
        <button id="m-review" aria-pressed="false">À revoir</button>
      </div>
    </div>
  </header>

  <div class="layout">
    <aside class="toc" id="toc" data-collapsed="true">
      <button class="btn toc-toggle" id="tocToggle">Afficher les seifim</button>
      <div class="toc-body">
        <h2>Progression</h2>
        <div class="stats">
          <div class="stat g"><b id="stKnown">0</b><small>Su</small></div>
          <div class="stat r"><b id="stReview">0</b><small>À revoir</small></div>
          <div class="stat"><b id="stNew">0</b><small>Pas vus</small></div>
        </div>
        <h2>Seifim</h2>
        <ol id="tocList"></ol>
        <div style="margin-top:14px"><button class="btn ghost" id="resetBtn">Effacer ma progression</button></div>
      </div>
    </aside>

    <main class="card" id="card" aria-live="polite"></main>
  </div>
  <footer class="f">Espace : indice suivant · ← → : sujet précédent / suivant · Les réponses sont gardées dans ce navigateur.</footer>
</div>

<script>
window.HALAKHA = { simanim: [], addSiman(s){ this.simanim.push(s); } };
</script>
<script src="data/manifest.js"></script>
<script>
(function(){
  const files = (typeof HALAKHA_FILES !== "undefined") ? HALAKHA_FILES : [];
  let pending = files.length;
  if(!pending) start();
  files.forEach(f=>{
    const s=document.createElement("script"); s.src=f;
    s.onload=s.onerror=()=>{ if(--pending===0) start(); };
    document.body.appendChild(s);
  });

  const LEVELS = [
    {k:"q",   fr:"Question",          he:"שאלה"},
    {k:"ref", fr:"Référence guemara", he:"מראה מקום"},
    {k:"gm",  fr:"Texte de la guemara", he:"גמרא"},
    {k:"ri",  fr:"Mahloket rishonim", he:"ראשונים"},
    {k:"ah",  fr:"Mahloket aharonim", he:"אחרונים"},
    {k:"ps",  fr:"Psak",              he:"שו״ע · משנ״ב · ביאה״ל · שעה״צ"}
  ];
  const PSAK = [["sa","שולחן ערוך"],["rama","רמ״א"],["mb","משנה ברורה"],["bh","ביאור הלכה"],["shtz","שער הציון"]];
  const KEY="hazara-progress-v1";
  let progress={};
  try{ progress=JSON.parse(localStorage.getItem(KEY)||"{}")||{}; }catch(e){ progress={}; }
  const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(progress)); }catch(e){} };

  let siman=null, topics=[], queue=[], pos=0, shown=0, mode="order", view="rev";
  try{ {const v=localStorage.getItem(KEY+"-view"); if(v==="ctl"||v==="ask") view=v;} }catch(e){}
  const $=id=>document.getElementById(id);
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  function has(t,k){
    if(k==="q") return true;
    if(k==="ref") return !!(t.gemara&&t.gemara.ref);
    if(k==="gm") return !!(t.gemara&&t.gemara.text&&t.gemara.text.length);
    if(k==="ri") return !!(t.rishonim&&t.rishonim.length);
    if(k==="ah") return !!(t.acharonim&&t.acharonim.length);
    if(k==="ps") return !!(t.psak&&PSAK.some(([p])=>t.psak[p]&&t.psak[p].length)) || !!t.table || !!(t.notes&&t.notes.length);
  }
  const avail=t=>LEVELS.map((l,i)=>i).filter(i=>has(t,LEVELS[i].k));

  function start(){
    const sel=$("simanSel");
    if(!HALAKHA.simanim.length){ $("card").innerHTML='<div class="empty">Aucun siman chargé.</div>'; return; }
    HALAKHA.simanim.sort((a,b)=>(+a.id)-(+b.id));
    sel.innerHTML=HALAKHA.simanim.map((s,i)=>`<option value="${i}">סימן ${esc(s.siman)} · ${esc(s.title)}</option>`).join("");
    let last=0; try{ last=+localStorage.getItem(KEY+"-siman")||0; }catch(e){}
    if(last>=HALAKHA.simanim.length) last=0;
    sel.value=last;
    sel.onchange=()=>{ try{localStorage.setItem(KEY+"-siman",sel.value);}catch(e){} loadSiman(+sel.value); };
    $("v-rev").onclick=()=>setView("rev");
    $("v-ctl").onclick=()=>setView("ctl");
    $("v-ask").onclick=()=>setView("ask");
    $("m-order").onclick=()=>setMode("order");
    $("m-random").onclick=()=>setMode("random");
    $("m-review").onclick=()=>setMode("review");
    $("tocToggle").onclick=()=>{ const t=$("toc"); const c=t.dataset.collapsed==="true"; t.dataset.collapsed=c?"false":"true"; $("tocToggle").textContent=c?"Masquer les seifim":"Afficher les seifim"; };
    $("resetBtn").onclick=resetProgress;
    document.addEventListener("keydown",onKey);
    loadSiman(last);
  }

  function loadSiman(i){
    siman=HALAKHA.simanim[i];
    topics=[];
    siman.seifim.forEach((f,fi)=>f.topics.forEach((t,ti)=>topics.push(Object.assign({},t,{_seif:f.seif,_seifTitle:f.title,_key:siman.id+"/"+fi+"/"+ti}))));
    buildQueue(); pos=0; shown=0; render();
  }
  function setView(v){
    view=v; try{localStorage.setItem(KEY+"-view",v);}catch(e){}
    render(); window.scrollTo({top:0});
  }
  function renderControl(){
    $("v-rev").setAttribute("aria-pressed","false"); $("v-ctl").setAttribute("aria-pressed","true");
    $("modeSeg").hidden=true; $("brandSub").textContent="Contrôle des mekorot et des mahloktot";
    let i=0, html=`<p class="ctl-help">Pour chaque sujet : les mekorot, les noms des rishonim et des aharonim, et les sources du psak. Touchez un élément pour vérifier son contenu.</p>`;
    siman.seifim.forEach(f=>{
      html+=`<section class="ctl-seif"><h2>סעיף ${esc(f.seif)} · ${esc(f.title)}</h2>`;
      f.topics.forEach(()=>{
        const t=topics[i]; const ti=i++;
        const row=(lab,cls,arr)=>arr&&arr.length?`<div class="ctl-row"><span class="ctl-lab">${lab}</span>${arr.map((o,j)=>`<button class="chip ${cls}" aria-expanded="false" data-op="${cls}-${ti}-${j}">${esc(o.who)}</button>`).join("")}</div><div class="ctl-ops" id="ops-${cls}-${ti}"></div>`:"";
        html+=`<div class="ctl-t" id="ctl-${ti}"><h3>${esc(t.title)}</h3>`
          +(t.gemara&&t.gemara.ref?`<div class="ctl-row"><span class="ctl-lab">מקורות</span><button class="chip mk" aria-expanded="false" data-op="mk-${ti}-0">${esc(t.gemara.ref)}</button></div><div class="ctl-ops" id="ops-mk-${ti}"></div>`:"")
          +row("ראשונים","ri",t.rishonim)+row("אחרונים","ah",t.acharonim)
          +(()=>{const ks=PSAK.filter(([k])=>t.psak&&t.psak[k]&&t.psak[k].length); if(t.notes&&t.notes.length) ks.push(["notes","הערות"]); return ks.length?`<div class="ctl-row"><span class="ctl-lab">פסק</span>${ks.map(([k,lab])=>`<button class="chip ps" aria-expanded="false" data-op="ps-${ti}-${k}">${lab}</button>`).join("")}</div><div class="ctl-ops" id="ops-ps-${ti}"></div>`:"";})()
          +`</div>`;
      });
      html+=`</section>`;
    });
    const card=$("card"); card.innerHTML=html;
    card.querySelectorAll("button.chip").forEach(b=>b.onclick=()=>{
      const [cls,ti,j]=b.dataset.op.split("-"); const t=topics[+ti];
      const box=$("ops-"+cls+"-"+ti); const id="op-"+b.dataset.op; const ex=document.getElementById(id);
      if(ex){ ex.remove(); b.setAttribute("aria-expanded","false"); return; }
      const d=document.createElement("div"); d.className="ctl-op"; d.id=id; if(cls==="mk"){ (t.gemara.text&&t.gemara.text.length?t.gemara.text:["(אין טקסט גמרא בסיכום)"]).forEach(x=>{const q=document.createElement("p");q.style.margin="0 0 .4em";q.textContent=x;d.appendChild(q);}); d.classList.add("gm"); } else if(cls==="ps"){ const arr=j==="notes"?t.notes:t.psak[j]; const lab=j==="notes"?"הערות":PSAK.find(x=>x[0]===j)[1]; const h=document.createElement("b"); h.textContent=lab; d.appendChild(h); arr.forEach(x=>{const q=document.createElement("p");q.style.margin=".2em 0 .4em";q.textContent=x;d.appendChild(q);}); d.classList.add("psk"); } else { const o=(cls==="ri"?t.rishonim:t.acharonim)[+j]; d.textContent=o.who+" : "+o.text; } box.appendChild(d); b.setAttribute("aria-expanded","true");
    });
  }

  /* ---------- Question libre : recherche dans tous les simanim + réponse IA (si disponible) ---------- */
  let corpus=null, askState={q:"",ans:"",status:"",src:[]}, askCtl=null;
  const norm=x=>String(x).replace(/[֑-ׇ]/g,"").replace(/[״׳"'`’]/g,"").replace(/[^א-תa-zA-Z0-9À-ſ\s]/g," ").toLowerCase();
  const STOP=new Set("של את על אם או גם לא כי זה זו הוא היא מה מי כל אך אבל עם יש אין דין האם כמו the de la le les des un une et est que qui pour dans sur en du au".split(" "));
  function getCorpus(){
    if(corpus) return corpus;
    corpus=[];
    HALAKHA.simanim.forEach((S,si)=>S.seifim.forEach((f,fi)=>f.topics.forEach((t,ti)=>{
      const parts=[];
      if(t.gemara&&t.gemara.ref) parts.push("מקור: "+t.gemara.ref);
      if(t.gemara&&t.gemara.text) parts.push("גמרא: "+t.gemara.text.join(" "));
      (t.rishonim||[]).forEach(o=>parts.push("ראשונים – "+o.who+": "+o.text));
      (t.acharonim||[]).forEach(o=>parts.push("אחרונים – "+o.who+": "+o.text));
      PSAK.forEach(([k,lab])=>{ if(t.psak&&t.psak[k]) t.psak[k].forEach(x=>parts.push(lab+": "+x)); });
      (t.notes||[]).forEach(x=>parts.push("הערה: "+x));
      if(t.table) parts.push("טבלה: "+[t.table.cols].concat(t.table.rows).map(r=>r.join(" | ")).join(" / "));
      const head=`סימן ${S.siman} סעיף ${f.seif} (${f.title}) – ${t.title}`;
      const body=parts.join("\n");
      corpus.push({id:S.id+"/"+fi+"/"+ti, si, key:S.id+"/"+fi+"/"+ti, head, title:t.title, question:t.question,
        text:head+"\nשאלה: "+t.question+"\n"+body, nh:norm(head+" "+t.question), nb:norm(body)});
    })));
    return corpus;
  }
  function search(q,n){
    const toks=norm(q).split(/\s+/).filter(w=>w.length>1&&!STOP.has(w));
    if(!toks.length) return [];
    const C=getCorpus();
    const scored=C.map(d=>{
      let sc=0;
      toks.forEach(w=>{
        const vs=[w]; if(/^[ובהלמשכ]/.test(w)&&w.length>3) vs.push(w.slice(1));
        let best=0;
        vs.forEach(v=>{ const re=new RegExp(v.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"g");
          const h=(d.nh.match(re)||[]).length, b=(d.nb.match(re)||[]).length;
          best=Math.max(best, h*3+Math.min(b,4)); });
        sc+=best;
      });
      return {d,sc};
    }).filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc);
    return scored.slice(0,n||6).map(x=>x.d);
  }
  function openTopic(key){
    const C=getCorpus(); const d=C.find(x=>x.key===key); if(!d) return;
    const sel=$("simanSel"); sel.value=d.si; try{localStorage.setItem(KEY+"-siman",sel.value);}catch(e){}
    view="rev"; try{localStorage.setItem(KEY+"-view","rev");}catch(e){}
    mode="order"; ["order","random","review"].forEach(x=>$("m-"+x).setAttribute("aria-pressed",x==="order"?"true":"false"));
    loadSiman(d.si);
    const ti=topics.findIndex(t=>t._key===key); if(ti>=0) jumpTo(ti);
  }
  function fmtAns(txt){
    return esc(txt).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/^#+\s*/gm,"");
  }
  function renderAskOut(){
    const a=$("askAns"), st=$("askStatus"), src=$("askSrc"); if(!a) return;
    a.innerHTML=fmtAns(askState.ans);
    a.classList.toggle("he",/[א-ת]/.test(askState.ans.slice(0,40)));
    st.textContent=askState.status;
    src.innerHTML=askState.src.length?`<h3>Sources dans le site · מקורות</h3>`+askState.src.map(d=>`<button data-k="${esc(d.key)}">${esc(d.head)}<small>${esc(d.question)}</small></button>`).join(""):"";
    src.querySelectorAll("button").forEach(b=>b.onclick=()=>openTopic(b.dataset.k));
  }
  function renderAsk(){
    $("v-rev").setAttribute("aria-pressed","false"); $("v-ctl").setAttribute("aria-pressed","false");
    $("modeSeg").hidden=true; $("brandSub").textContent="Posez une question sur tous les simanim";
    const names=HALAKHA.simanim.map(s=>s.siman).join(", ");
    $("card").innerHTML=`
      <p class="ctl-help">Posez votre question en français ou en hébreu. La réponse s'appuie uniquement sur le contenu du site (סימנים ${esc(names)}), avec les sujets sources à ouvrir en dessous.</p>
      <form class="ask-form" id="askForm">
        <textarea id="askQ" dir="auto" placeholder="Ex. : כוסס חיטה וזית – על מה מברך תחילה?  ·  Quelle brakha sur un poivron farci ?"></textarea>
        <div class="ask-row"><button class="btn primary" type="submit" id="askBtn">Demander</button><span class="ask-status" id="askStatus"></span></div>
      </form>
      <div class="ask-ans" id="askAns" dir="auto"></div>
      <div class="ask-src" id="askSrc"></div>`;
    $("askQ").value=askState.q;
    $("askQ").addEventListener("keydown",e=>{ if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)){ e.preventDefault(); ask(); } });
    $("askForm").onsubmit=e=>{ e.preventDefault(); ask(); };
    renderAskOut();
  }
  async function ask(){
    const q=$("askQ").value.trim(); if(!q) return;
    if(askCtl) askCtl.abort();
    askState={q,ans:"",status:"Recherche…",src:search(q,6)}; renderAskOut();
    let sample=null;
    try{ sample=(window.claude&&window.claude.use)? await window.claude.use("sample") : null; }catch(e){ sample=null; }
    if(!sample){
      askState.status=askState.src.length?"":"Aucun sujet trouvé. Essayez avec les mots hébreux du sujet (ex. : עיקר וטפל, קדימה, מעין שלוש).";
      if(askState.src.length) askState.ans="La réponse rédigée n'est disponible que dans la version Claude du site. Voici les sujets les plus proches de votre question :";
      renderAskOut(); return;
    }
    const toc=getCorpus().map(d=>`${d.id} | ${d.head}`).join("\n");
    const ctx=askState.src.map(d=>`[${d.id}]\n${d.text}`).join("\n\n");
    const prompt=`Tu es un assistant de révision de halakha (Choulhan Aroukh, Orah Haïm, hilkhot brakhot). Réponds à la question de l'élève en t'appuyant UNIQUEMENT sur les fiches de son cours ci-dessous (résumés du livre « שירת הים »). Si les fiches ne contiennent pas la réponse, dis-le clairement au lieu d'inventer.

Règles :
- Réponds dans la langue de la question (français ou hébreu). Garde les noms des sources et les citations en hébreu.
- Commence par la réponse pratique (le psak), puis la mahloket : rishonim, aharonim, puis שו״ע / רמ״א / משנ״ב / ביאה״ל / שעה״צ, avec les ס״ק indiqués dans les fiches.
- Indique entre crochets le sujet utilisé, ex. [סימן רי״ב סעיף א׳ – כשהטפל חביב עליו].
- Texte simple, pas de tableaux. Tu peux mettre en gras avec **...**. Sois concis.
- Si les fiches fournies ne suffisent pas, utilise l'outil chercher (mots-clés en hébreu) ou lire_sujet (id du sommaire).

Sommaire de toutes les fiches (id | titre) :
${toc}

Fiches les plus proches de la question :
${ctx||"(aucune trouvée par la recherche automatique)"}

Question de l'élève : ${q}`;
    const used=new Map(askState.src.map(d=>[d.key,d]));
    const tools=[
      {name:"chercher",description:"Recherche par mots-clés (de préférence en hébreu) dans toutes les fiches du cours. Renvoie le texte complet des fiches les plus pertinentes.",
       inputSchema:{type:"object",properties:{requete:{type:"string"}},required:["requete"]},
       execute:({requete})=>{ const r=search(requete,4); r.forEach(d=>used.set(d.key,d)); return r.length? r.map(d=>`[${d.id}]\n${d.text}`).join("\n\n") : "Aucun résultat."; }},
      {name:"lire_sujet",description:"Lit le texte complet d'une fiche à partir de son id (ex. 211/3/0) donné dans le sommaire.",
       inputSchema:{type:"object",properties:{id:{type:"string"}},required:["id"]},
       execute:({id})=>{ const d=getCorpus().find(x=>x.id===String(id).trim()); if(!d) throw new Error("id inconnu"); used.set(d.key,d); return d.text; }}
    ];
    askCtl=new AbortController(); const ctl=askCtl;
    askState.status="Claude réfléchit…"; renderAskOut();
    try{
      const r=await sample(prompt,{tools,cache:false,signal:ctl.signal,
        onText:({text})=>{ if(ctl!==askCtl) return; askState.ans=text; askState.status="Rédaction…"; renderAskOut(); }});
      if(ctl!==askCtl) return;
      askState.ans=r.text; askState.status=r.truncated?"Réponse tronquée.":"";
      const cited=[...used.values()].filter(d=>r.text.includes(d.title));
      askState.src=(cited.length?cited:[...used.values()]).slice(0,8);
    }catch(e){
      if(ctl!==askCtl) return;
      if(e&&e.text) askState.ans=e.text;
      askState.status = e&&e.code==="not_granted" ? "L'accès à Claude a été refusé : seuls les sujets proches sont affichés."
        : e&&e.code==="rate_limited" ? "Trop de questions d'affilée, réessayez dans un moment."
        : "La réponse n'a pas pu être obtenue. Les sujets proches sont affichés ci-dessous.";
    }
    renderAskOut();
  }
  function setMode(m){
    mode=m; ["order","random","review"].forEach(x=>$("m-"+x).setAttribute("aria-pressed",x===m?"true":"false"));
    buildQueue(); pos=0; shown=0; render();
  }
  function buildQueue(){
    let idx=topics.map((t,i)=>i);
    if(mode==="review") idx=idx.filter(i=>progress[topics[i]._key]&&progress[topics[i]._key].s==="review");
    if(mode==="random"){ for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];} }
    queue=idx;
  }
  function resetProgress(){
    const b=$("resetBtn");
    if(b.dataset.confirm!=="1"){ b.dataset.confirm="1"; b.textContent="Confirmer l'effacement"; setTimeout(()=>{b.dataset.confirm="";b.textContent="Effacer ma progression";},4000); return; }
    topics.forEach(t=>delete progress[t._key]); save(); b.dataset.confirm=""; b.textContent="Effacer ma progression"; buildQueue(); render();
  }

  function cur(){ return queue.length? topics[queue[pos]] : null; }

  function renderToc(){
    let k=0,r=0,n=0;
    topics.forEach(t=>{const p=progress[t._key]; if(!p)n++; else if(p.s==="known")k++; else r++;});
    $("stKnown").textContent=k; $("stReview").textContent=r; $("stNew").textContent=n;
    const c=cur();
    let html="", i=0;
    siman.seifim.forEach(f=>{
      html+=`<li class="seif"><div>סעיף ${esc(f.seif)} · ${esc(f.title)}</div><ol>`;
      f.topics.forEach(()=>{
        const t=topics[i]; const p=progress[t._key];
        html+=`<li><button class="t" data-i="${i}" aria-current="${c&&c._key===t._key}"><span class="dot ${p?p.s:""}"></span>${esc(t.title)}</button></li>`;
        i++;
      });
      html+="</ol></li>";
    });
    $("tocList").innerHTML=html;
    $("tocList").querySelectorAll("button.t").forEach(b=>b.onclick=()=>jumpTo(+b.dataset.i));
  }
  function jumpTo(ti){
    if(view==="ask") view="rev";
    if(view==="ctl"){ const el=document.getElementById("ctl-"+ti); if(el) el.scrollIntoView({behavior:"smooth",block:"start"}); return; }
    let p=queue.indexOf(ti);
    if(p<0){ setMode("order"); p=queue.indexOf(ti); }
    pos=p; shown=0; render(); window.scrollTo({top:0,behavior:"smooth"});
  }

  function lvlHtml(t,i){
    const L=LEVELS[i], head=`<h3>${L.fr}<span class="heb">${L.he}</span></h3>`;
    if(L.k==="ref") return `<section class="lvl">${head}<div class="ref">${esc(t.gemara.ref)}</div></section>`;
    if(L.k==="gm") return `<section class="lvl">${head}<div class="he-text gm">${t.gemara.text.map(p=>`<p>${esc(p)}</p>`).join("")}</div></section>`;
    if(L.k==="ri"||L.k==="ah"){
      const arr=L.k==="ri"?t.rishonim:t.acharonim;
      return `<section class="lvl">${head}${arr.map(o=>`<div class="op ${L.k}"><div class="who">${esc(o.who)}</div><div class="txt">${esc(o.text)}</div></div>`).join("")}</section>`;
    }
    if(L.k==="ps"){
      let h="";
      PSAK.forEach(([k,lab])=>{
        const a=t.psak&&t.psak[k]; if(!a||!a.length) return;
        if(k==="sa"||k==="rama") h+=`<div class="psak-block"><span class="lab">${lab}</span>${a.map(x=>`<p class="sa">${esc(x)}</p>`).join("")}</div>`;
        else h+=`<div class="psak-block"><span class="lab">${lab}</span><ul>${a.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`;
      });
      if(t.notes&&t.notes.length) h+=`<div class="psak-block"><span class="lab">הערות</span>${t.notes.map(x=>`<p class="notes">${esc(x)}</p>`).join("")}</div>`;
      if(t.table) h+=`<div class="psak-block"><span class="lab">סיכום</span><div class="tbl"><table><thead><tr>${t.table.cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${t.table.rows.map(r=>`<tr>${r.map((c,j)=>j===0?`<th>${esc(c)}</th>`:`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`;
      return `<section class="lvl">${head}${h}</section>`;
    }
    return "";
  }

  function render(){
    renderToc();
    $("v-ask").setAttribute("aria-pressed",view==="ask"?"true":"false");
    if(view==="ask"){ renderAsk(); return; }
    if(view==="ctl"){ renderControl(); return; }
    $("v-rev").setAttribute("aria-pressed","true"); $("v-ctl").setAttribute("aria-pressed","false");
    $("modeSeg").hidden=false; $("brandSub").textContent="Révision par seif";
    const card=$("card"); const t=cur();
    if(!t){
      card.innerHTML=`<div class="empty">${mode==="review"?"Rien à revoir pour ce siman. Passez en mode « Dans l'ordre » ou « Aléatoire ».":"Aucun sujet."}</div>`;
      return;
    }
    const av=avail(t); const p=progress[t._key];
    const revealedIdx=av.slice(1,1+shown);
    const done=shown>=av.length-1;
    const status=p?(p.s==="known"?`<span class="pill known">Su${p.h?` · ${p.h} indice${p.h>1?"s":""}`:""}</span>`:`<span class="pill review">À revoir</span>`):`<span class="pill new">Pas encore vu</span>`;
    const ladder=LEVELS.map((L,i)=>{
      const cls=!av.includes(i)?"skip":(i===0||revealedIdx.includes(i))?"on":"";
      const isNext=!done&&av[shown+1]===i;
      return `<div class="rung ${cls} ${isNext?"cur":""}" title="${L.fr}">${L.he.split(" · ")[0]}</div>`;
    }).join("");
    const nextLvl=!done?LEVELS[av[shown+1]]:null;
    card.innerHTML=`
      <div class="crumbs"><span class="he">סימן ${esc(siman.siman)} · סעיף ${esc(t._seif)} · ${esc(t._seifTitle)}</span><span>${pos+1} / ${queue.length} ${status}</span></div>
      <div class="ladder" aria-hidden="true">${ladder}</div>
      <p class="question">${esc(t.question)}</p>
      <div class="qtitle">${esc(t.title)}</div>
      <div class="levels">${revealedIdx.map(i=>lvlHtml(t,i)).join("")}</div>
      <div class="actions">
        ${!done?`<button class="btn primary" id="hintBtn">Je ne sais pas · ${nextLvl.fr}</button><button class="btn ghost" id="allBtn">Tout afficher</button>`:""}
        <span class="spacer"></span>
        <button class="btn good" id="knewBtn">Je savais</button>
        <button class="btn bad" id="reviewBtn">À revoir</button>
      </div>
      <div class="actions" style="margin-top:10px">
        <button class="btn ghost" id="prevBtn" ${pos===0?"disabled":""}>← Précédent</button>
        <span class="spacer"></span>
        <button class="btn ghost" id="nextBtn" ${pos>=queue.length-1?"disabled":""}>Suivant →</button>
      </div>`;
    if(!done){ $("hintBtn").onclick=hint; $("allBtn").onclick=()=>{shown=av.length-1;render();}; }
    $("knewBtn").onclick=()=>mark("known");
    $("reviewBtn").onclick=()=>mark("review");
    $("prevBtn").onclick=()=>go(-1);
    $("nextBtn").onclick=()=>go(1);
  }
  function hint(){ const t=cur(); if(!t) return; const av=avail(t); if(shown<av.length-1){shown++;render(); const l=document.querySelectorAll(".lvl"); if(l.length) l[l.length-1].scrollIntoView({behavior:"smooth",block:"nearest"});} }
  function mark(s){
    const t=cur(); if(!t) return;
    progress[t._key]={s, h:shown, d:Date.now()}; save();
    if(mode==="review" && s==="known"){ queue.splice(pos,1); if(pos>=queue.length) pos=Math.max(0,queue.length-1); shown=0; render(); return; }
    go(1,true);
  }
  function go(d,auto){
    const np=pos+d;
    if(np<0) return;
    if(np>=queue.length){ if(auto){ shown=0; render(); } return; }
    pos=np; shown=0; render(); window.scrollTo({top:0,behavior:"smooth"});
  }
  function onKey(e){
    if(e.target.tagName==="SELECT"||e.target.tagName==="TEXTAREA"||e.metaKey||e.ctrlKey||view!=="rev") return;
    if(e.key===" "){ e.preventDefault(); hint(); }
    else if(e.key==="ArrowRight") go(1);
    else if(e.key==="ArrowLeft") go(-1);
  }
})();
</script>

</html>
